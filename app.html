    theme: { extend: {
      colors: { bg:'#0a1330', panel:'#101b3f', line:'#23315c', brand:'#1e3a8a', amber:'#f5a524', emerald:'#10b981', ink:'#eef2ff', dim:'#94a3c4', danger:'#f87171' },

<style>
  body { background:#0a1330; color:#eef2ff; }
  .focus-ring:focus-visible{ outline:2px solid #f5a524; outline-offset:3px; }
  .inp{ width:100%; background:transparent; border:1px solid #23315c; border-radius:6px; padding:.55rem .75rem; font-size:.875rem; color:#eef2ff; }
  .inp:focus{ outline:none; border-color:#f5a524; }
  .inp::placeholder{ color:#94a3c4; }
  select.inp option{ background:#101b3f; }
  .lbl{ display:block; font-size:.75rem; color:#94a3c4; margin-bottom:.3rem; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:.4rem; font-size:.875rem; border-radius:6px; padding:.55rem 1rem; border:1px solid #23315c; transition:all .15s; }
  .btn:hover{ border-color:#94a3c4; }
  .btn-primary{ background:#f5a524; color:#0a1330; border-color:#f5a524; font-weight:600; }
  .btn-primary:hover{ filter:brightness(1.08); border-color:#f5a524; }
  .btn-danger{ color:#f87171; border-color:#5b2333; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .card{ background:#101b3f; border:1px solid #23315c; border-radius:12px; }
  .chip{ font-family:'JetBrains Mono',monospace; font-size:.7rem; padding:.15rem .5rem; border-radius:999px; border:1px solid #23315c; white-space:nowrap; }
  .chip-planned{ color:#94a3c4; } .chip-en_route{ color:#f5a524; border-color:#6b4d16; } .chip-delivered{ color:#10b981; border-color:#14513f; }
  .tabbar::-webkit-scrollbar{ display:none; }
  #qr-full{ background:#fff; color:#0a1330; }
  #qr-full svg{ width:100%; height:auto; display:block; }
  .qr-box svg{ width:100%; height:auto; display:block; }
  #sigpad{ touch-action:none; background:#fff; border-radius:8px; width:100%; height:200px; }
  .fade{ animation:rise .25s ease both; }
  @keyframes rise{ from{ opacity:0; transform:translateY(5px);} to{ opacity:1; transform:none;} }
</style>
</head>
<body class="antialiased font-sans min-h-screen">

<!-- CHARGEMENT -->
<div id="v-loading" class="min-h-screen flex items-center justify-center text-dim text-sm font-mono">Bouadigital…</div>

<!-- CONNEXION / INSCRIPTION -->
<div id="v-auth" class="hidden min-h-screen flex items-center justify-center px-5 py-10">
  <div class="w-full max-w-sm">
    <div class="flex items-center justify-between mb-8">
      <a href="index.html" class="flex items-center gap-2">
        <svg width="30" height="30" viewBox="0 0 512 512"><rect width="512" height="512" rx="128" fill="#1e3a8a"/><path d="M120 180h180v140H120zM300 230l70 20v70h-70z" fill="#60a5fa"/><circle cx="180" cy="360" r="36" fill="#10b981"/><circle cx="340" cy="360" r="36" fill="#10b981"/></svg>
        <span class="font-semibold text-lg">Bouadigital</span>
      </a>
      <div class="flex items-center gap-2">
        <button data-act="install" class="install-btn hidden items-center gap-1.5 text-xs font-semibold bg-amber text-bg rounded-md px-2.5 py-1.5"><span data-i18n="pwa.install"></span></button>
        <button data-act="lang" class="text-xs font-mono border border-line rounded-md px-2.5 py-1.5 text-dim lang-label">FR</button>
      </div>
    </div>
    <div class="card p-6">
      <div class="flex gap-2 border-b border-line mb-5">
        <button data-act="authTab" data-tab="login" class="auth-tab px-3 py-2 text-sm border-b-2" data-i18n="auth.login"></button>
        <button data-act="authTab" data-tab="signup" class="auth-tab px-3 py-2 text-sm border-b-2" data-i18n="auth.signup"></button>
      </div>
      <form data-form="login" id="f-login" class="space-y-3">
        <div><label class="lbl" data-i18n="auth.email"></label><input name="email" type="email" required class="inp" autocomplete="email" /></div>
        <div><label class="lbl" data-i18n="auth.password"></label><input name="password" type="password" required class="inp" autocomplete="current-password" /></div>
        <button class="btn btn-primary w-full" data-i18n="auth.submitLogin"></button>
        <button type="button" data-act="forgot" class="text-xs text-dim hover:text-ink" data-i18n="auth.forgot"></button>
      </form>
      <form data-form="signup" id="f-signup" class="hidden space-y-3">
        <div><label class="lbl" data-i18n="auth.name"></label><input name="name" required maxlength="80" class="inp" autocomplete="name" /></div>
        <div><label class="lbl" data-i18n="auth.email"></label><input name="email" type="email" required class="inp" autocomplete="email" /></div>
        <div><label class="lbl" data-i18n="auth.password"></label><input name="password" type="password" required minlength="6" class="inp" autocomplete="new-password" /></div>
        <label class="flex items-center gap-2 text-sm text-dim"><input type="checkbox" name="hasCode" data-act="toggleCode" /> <span data-i18n="auth.hasCode"></span></label>
        <div id="code-wrap" class="hidden"><label class="lbl" data-i18n="auth.code"></label><input name="code" class="inp font-mono uppercase" maxlength="12" /></div>
        <button class="btn btn-primary w-full" data-i18n="auth.submitSignup"></button>
        <p class="text-[11px] text-dim" data-i18n="auth.terms"></p>
      </form>
      <p id="auth-error" class="hidden mt-3 text-xs text-danger"></p>
    </div>
  </div>
</div>

<!-- CRÉATION DE L'ENTREPRISE -->
<div id="v-onboard" class="hidden min-h-screen flex items-center justify-center px-5 py-10">
  <div class="w-full max-w-md card p-6">
    <h1 class="text-xl font-semibold" data-i18n="onboard.title"></h1>
    <p class="text-dim text-sm mt-1" data-i18n="onboard.sub"></p>
    <form data-form="onboard" class="mt-5 space-y-3">
      <div><label class="lbl" data-i18n="onboard.company"></label><input name="name" required maxlength="100" class="inp" /></div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="lbl" data-i18n="onboard.nif"></label><input name="nif" maxlength="20" class="inp" /></div>
        <div><label class="lbl" data-i18n="onboard.city"></label><input name="city" maxlength="60" class="inp" /></div>
      </div>
      <div><label class="lbl" data-i18n="onboard.phone"></label><input name="phone" maxlength="30" class="inp" /></div>
      <button class="btn btn-primary w-full" data-i18n="onboard.create"></button>
    </form>
    <p id="onboard-error" class="hidden mt-3 text-xs text-danger"></p>
    <button data-act="logout" class="mt-4 text-xs text-dim hover:text-ink" data-i18n="nav.logout"></button>
  </div>
</div>

<!-- APPLICATION -->
<div id="v-app" class="hidden min-h-screen">
  <header class="sticky top-0 z-30 backdrop-blur bg-bg/85 border-b border-line">
    <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2 min-w-0">
        <div id="h-logo" class="w-8 h-8 rounded-md bg-brand shrink-0 overflow-hidden flex items-center justify-center text-xs font-semibold"></div>
        <div class="min-w-0">
          <p id="h-company" class="font-semibold text-sm truncate"></p>
          <p id="h-user" class="text-[11px] text-dim truncate"></p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button data-act="lang" class="text-xs font-mono border border-line rounded-md px-2.5 py-1.5 text-dim lang-label">FR</button>
        <button data-act="install" class="install-btn hidden items-center gap-1.5 text-xs font-semibold bg-amber text-bg rounded-md px-2.5 py-1.5"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 19h14"/></svg><span data-i18n="pwa.install"></span></button>
        <button data-act="logout" class="text-xs border border-line rounded-md px-2.5 py-1.5 text-dim hover:text-ink" data-i18n="nav.logout"></button>
      </div>
    </div>
    <nav id="tabbar" class="tabbar max-w-6xl mx-auto px-2 flex gap-1 overflow-x-auto"></nav>
  </header>
  <div id="banner" class="max-w-6xl mx-auto px-4"></div>
  <main id="main" class="max-w-6xl mx-auto px-4 py-6 pb-24"></main>
</div>

<!-- MODALE -->
<div id="modal" class="hidden fixed inset-0 z-50 bg-black/60 flex items-end md:items-center justify-center">
  <div id="modal-body" class="bg-panel border border-line w-full md:max-w-2xl max-h-[92vh] overflow-y-auto rounded-t-2xl md:rounded-xl p-5 fade"></div>
</div>

<!-- DOCUMENTS : sélecteurs de fichiers (caméra / fichier) -->
<input type="file" id="scan-camera" accept="image/*" capture="environment" class="hidden" />
<input type="file" id="scan-file" accept="image/*,application/pdf" multiple class="hidden" />

<!-- QR PLEIN ÉCRAN (contrôle routier) -->
<div id="qr-full" class="hidden fixed inset-0 z-[70] flex flex-col items-center justify-center p-6 text-center" data-act="qrClose"></div>

<!-- HORS LIGNE -->
<div id="offline-bar" class="hidden fixed top-0 inset-x-0 z-[65] bg-amber text-bg text-xs font-semibold text-center py-1.5 px-3" data-i18n="pwa.offline"></div>

<!-- NOUVELLE VERSION -->
<div id="update-bar" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 z-[66] card px-4 py-3 text-sm flex items-center gap-3 shadow-xl w-[calc(100%-2rem)] max-w-md">
  <span class="flex-1" data-i18n="pwa.update"></span>
  <button data-act="applyUpdate" class="btn btn-primary" data-i18n="pwa.updateBtn"></button>
</div>

<!-- BANDEAU D'INSTALLATION (mobile) -->
<div id="install-banner" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 z-[64] card p-4 shadow-xl w-[calc(100%-2rem)] max-w-md">
  <div class="flex items-start gap-3">
    <img src="/icons/icon-192.png" alt="" class="w-11 h-11 rounded-xl shrink-0" />
    <div class="flex-1 min-w-0">
      <p class="font-semibold text-sm" data-i18n="pwa.bannerTitle"></p>
      <p class="text-xs text-dim mt-0.5" data-i18n="pwa.bannerText"></p>
    </div>
    <button data-act="installDismiss" class="text-dim text-lg leading-none" aria-label="close">×</button>
  </div>
  <button data-act="install" class="btn btn-primary w-full mt-3" data-i18n="pwa.install"></button>
</div>

<!-- INSTRUCTIONS iPHONE / iPAD -->
<div id="ios-sheet" class="hidden fixed inset-0 z-[67] bg-black/60 flex items-end md:items-center justify-center p-4" data-act="iosClose">
  <div class="card p-5 w-full max-w-sm" onclick="event.stopPropagation()">
    <p class="font-semibold" data-i18n="pwa.iosTitle"></p>
    <ol class="mt-3 space-y-2 text-sm text-dim list-decimal pl-5">
      <li data-i18n="pwa.ios1"></li><li data-i18n="pwa.ios2"></li><li data-i18n="pwa.ios3"></li>
    </ol>
    <button data-act="iosClose" class="btn w-full mt-4" data-i18n="c.close"></button>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="hidden fixed bottom-24 left-1/2 -translate-x-1/2 z-[60] bg-ink text-bg text-sm px-4 py-2.5 rounded-md shadow-lg max-w-[90vw]"></div>

function rand(n) { const a = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; const b = crypto.getRandomValues(new Uint8Array(n)); return Array.from(b, x => a[x % a.length]).join(""); }

function authTab(tab) {
  document.querySelectorAll(".auth-tab").forEach(b => {
    const on = b.dataset.tab === tab;
    b.classList.toggle("border-amber", on); b.classList.toggle("text-ink", on);
    b.classList.toggle("border-transparent", !on); b.classList.toggle("text-dim", !on);
  });
  $("#f-login").classList.toggle("hidden", tab !== "login");
  $("#f-signup").classList.toggle("hidden", tab !== "signup");
  $("#auth-error").classList.add("hidden");
}
function authError(err) {
  const map = { "auth/email-already-in-use":"auth.errExists", "auth/weak-password":"auth.errWeak" };
  const el = $("#auth-error");
  el.textContent = err.i18n ? t(err.i18n) : t(map[err.code] || "auth.errAuth");
  el.classList.remove("hidden");
}

const FORMS = {};
FORMS.login = async f => {
  try { await auth.signInWithEmailAndPassword(f.email.value.trim(), f.password.value); }
  catch (e) { authError(e); }
};
FORMS.signup = async f => {
  const code = f.hasCode.checked ? f.code.value.trim().toUpperCase() : "";
  let invite = null;
  try {
    if (code) {
      const snap = await db.doc("invites/" + code).get();
      if (!snap.exists || snap.data().usedBy) return authError({ i18n: "auth.codeInvalid" });
      invite = snap.data();
      S.joining = true;
    }
    const cred = await auth.createUserWithEmailAndPassword(f.email.value.trim(), f.password.value);
    const name = f.name.value.trim();
    await cred.user.updateProfile({ displayName: name });
    if (invite) {
      const b = db.batch();
      b.set(db.doc("users/" + cred.user.uid), { companyId: invite.companyId, role: "driver", name, email: cred.user.email, inviteCode: code, createdAt: FV.serverTimestamp() });
      b.update(db.doc("invites/" + code), { usedBy: cred.user.uid });
      await b.commit();
    }
  } catch (e) { S.joining = false; authError(e); }
};
FORMS.onboard = async f => {
  const u = S.user, cref = db.collection("companies").doc();
  const name = f.name.value.trim(), nif = f.nif.value.trim(), city = f.city.value.trim(), phone = f.phone.value.trim();
  const b = db.batch();
  b.set(cref, {
    name, nif, city, phone, address: "", email: u.email, color: "#f5a524", logo: "", taxRate: 21,
    ownerUid: u.uid, plan: "trial", invoiceSeq: 0,
    trialEnds: TS.fromMillis(Date.now() + 30 * 864e5), createdAt: FV.serverTimestamp()
  });
  b.set(db.doc("users/" + u.uid), { companyId: cref.id, role: "admin", name: u.displayName || "", email: u.email, createdAt: FV.serverTimestamp() });
  b.set(db.doc("publicProfiles/" + cref.id), { name, city, phone, email: u.email, color: "#f5a524", logo: "" });
  try { await b.commit(); }
  catch (e) { const el = $("#onboard-error"); el.textContent = t("c.error") + " (" + (e.code || "") + ")"; el.classList.remove("hidden"); console.error(e); }
};

function boot() {
  applyStaticI18n();
  if (!configured) {
    show("v-auth"); authTab("login");
    const el = $("#auth-error"); el.textContent = "Configuration Firebase manquante : remplissez firebaseConfig dans app.html (voir README)."; el.classList.remove("hidden");
    return;
  }
  const params = new URLSearchParams(location.search);
  if (params.get("invite")) {
    authTab("signup"); const f = $("#f-signup");
    f.hasCode.checked = true; $("#code-wrap").classList.remove("hidden"); f.code.value = params.get("invite");
  } else authTab(params.get("signup") ? "signup" : "login");
  if (params.get("paid")) setTimeout(() => toast(t("ban.paidOk")), 800);
  if (params.get("tab")) S.tab = params.get("tab");
  if (params.get("new")) S.pendingNew = true;

  auth.onAuthStateChanged(user => {
    stopAll();
    S.user = user;
    if (!user) { show("v-auth"); return; }
    show("v-loading");
    S.unsubUser = db.doc("users/" + user.uid).onSnapshot(snap => {
      if (!snap.exists) { if (S.joining) return; stopData(); S.profile = null; show("v-onboard"); return; }
      S.joining = false;
      S.profile = snap.data();
      if (S.cid !== S.profile.companyId) listenCompany(S.profile.companyId);
    }, err => { fail(err); show("v-onboard"); });
  });
}

function listenCompany(cid) {
  if (S.unsubCompany) S.unsubCompany();
  stopData();
  S.cid = cid;
  S.unsubCompany = db.doc("companies/" + cid).onSnapshot(snap => {
    if (!snap.exists) return;
    S.company = snap.data();
    if (S.dataCid !== cid) startData(cid);
    show("v-app");
    renderShell();
    if (!S.firstRender || ["dashboard","billing","team"].includes(S.tab)) { S.firstRender = true; render(); }
    if (S.pendingNew && isAdmin() && isActive()) { S.pendingNew = false; ACT.newMission(); }
  }, fail);
}

function startData(cid) {
  S.dataCid = cid;
  const base = db.collection("companies").doc(cid);
  const on = (q, key, after) => S.unsubs.push(q.onSnapshot(s => { S[key] = s.docs.map(d => ({ id: d.id, ...d.data() })); if (after) after(); refresh(key); }, err => console.warn(key, err.code)));
  on(base.collection("missions").orderBy("createdAt", "desc").limit(500), "missions", () => { refreshMissionModal(); refreshDecaModal(); });
  on(base.collection("docs").orderBy("createdAt", "desc").limit(1000), "docs");
  on(db.collection("fret").orderBy("createdAt", "desc").limit(80), "fret");
  if (isAdmin()) {
    on(base.collection("invoices").orderBy("createdAt", "desc").limit(500), "invoices");
    on(base.collection("quotes").orderBy("createdAt", "desc").limit(200), "quotes");
    on(db.collection("users").where("companyId", "==", cid), "members");
    on(db.collection("invites").where("companyId", "==", cid).where("usedBy", "==", null), "invites");
    if (S.company.ownerUid === S.user.uid) {
      on(db.collection("customers").doc(S.user.uid).collection("subscriptions").where("status", "in", ["active","trialing"]), "subs", syncSubscription);
    }
  }
}

/* Recopie l'abonnement Stripe actif sur l'entreprise (vérifié par les règles Firestore) */
async function syncSubscription() {
  const subs = S.subs.filter(s => s.current_period_end && ["solo","flotte"].includes(s.role));
  if (!subs.length) { if (S.subs.length) console.warn("Abonnement sans metadata firebaseRole (solo / flotte) sur le produit Stripe."); return; }
  subs.sort((a, b) => b.current_period_end.toMillis() - a.current_period_end.toMillis());
  const s = subs[0], c = S.company;
  if (c.subId === s.id && c.plan === s.role && c.paidUntil && c.paidUntil.toMillis() === s.current_period_end.toMillis()) return;
  try { await db.doc("companies/" + S.cid).update({ plan: s.role, paidUntil: s.current_period_end, subId: s.id }); }
  catch (e) { fail(e); }
}

let pendingLogo; // undefined = pas de changement, "" = retiré, dataURL = nouveau
function bindSettings() {
  pendingLogo = undefined;
  const input = $("#logo-file");
  if (input) input.addEventListener("change", () => {
    const file = input.files[0]; if (!file) return;
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 240, k = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement("canvas"); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      let data = cv.toDataURL("image/png");
      if (data.length > 120000) data = cv.toDataURL("image/jpeg", 0.85);
      pendingLogo = data; URL.revokeObjectURL(url);
      $("#logo-prev").innerHTML = `<img src="${data}" class="w-full h-full object-contain">`;
    };
    img.src = url;
  });
}

FORMS.mission = async f => {
  if (!guard()) return;
  const id = f.dataset.id, quoteId = f.dataset.quote;
  const fields = ["depart","arrivee","date","goods","weight","plate","eta","shipper","consignee","shipperAddr","consigneeAddr","client","clientNif","clientEmail","notes"];
  const data = {}; fields.forEach(k => data[k] = f[k].value.trim());
  data.price = f.price.value ? round2(f.price.value) : 0;
  data.driverUid = f.driverUid.value;
  const d = S.members.find(m => m.id === data.driverUid);
  data.driverName = d ? (d.name || d.email) : (S.profile.name || "");
  const base = db.collection("companies").doc(S.cid).collection("missions");
  const b = db.batch();
  try {
    if (id) {
      const m = S.missions.find(x => x.id === id);
      b.update(base.doc(id), data);
      if (m && m.trackingCode) b.update(db.doc("tracking/" + m.trackingCode), { depart: data.depart, arrivee: data.arrivee, eta: data.eta, updatedAt: FV.serverTimestamp() });
    } else {
      const ref = base.doc(), code = rand(10);
      Object.assign(data, {
        ref: "M-" + todayStr().replace(/-/g, "") + "-" + rand(3), status: "planned", trackingCode: code,
        position: null, invoiceId: null, invoiceNumber: "", signature: "", signedBy: "", deliveredAt: null,
        createdBy: S.user.uid, createdAt: FV.serverTimestamp()
      });
      b.set(ref, data);
      b.set(db.doc("tracking/" + code), { companyId: S.cid, companyName: S.company.name, ref: data.ref, depart: data.depart, arrivee: data.arrivee, status: "planned", position: null, eta: data.eta, updatedAt: FV.serverTimestamp() });
      if (quoteId) b.update(db.doc(`companies/${S.cid}/quotes/${quoteId}`), { status: "done" });
    }
    await b.commit();
    toast(t("m.saved")); closeModal();
  } catch (e) { fail(e); }
};

/* --- GPS --- */
const gps = { id: null, missionId: null, last: 0, lock: null };
async function startGps(m) {
  if (!navigator.geolocation) return toast(t("m.gpsUnsupported"));
  stopGps();
  gps.missionId = m.id; gps.last = 0;
  try { if (navigator.wakeLock) gps.lock = await navigator.wakeLock.request("screen"); } catch (e) {}
  gps.id = navigator.geolocation.watchPosition(pos => {
    if (Date.now() - gps.last < GPS_INTERVAL_MS) return;
    gps.last = Date.now();
    const mm = S.missions.find(x => x.id === gps.missionId);
    if (!mm || mm.status !== "en_route") return stopGps();
    const p = { lat: +pos.coords.latitude.toFixed(5), lng: +pos.coords.longitude.toFixed(5), at: TS.now() };
    const b = db.batch();
    b.update(db.doc(`companies/${S.cid}/missions/${mm.id}`), { position: p });
    b.update(db.doc("tracking/" + mm.trackingCode), { position: p, updatedAt: FV.serverTimestamp() });
    b.commit().catch(e => console.warn("gps", e.code));
  }, err => { toast(err.code === 1 ? t("m.gpsDenied") : t("m.gpsUnsupported")); stopGps(); }, { enableHighAccuracy: true, maximumAge: 30000, timeout: 30000 });
  refreshMissionModal();
}
function stopGps() {
  if (gps.id !== null && navigator.geolocation) navigator.geolocation.clearWatch(gps.id);
  gps.id = null; gps.missionId = null;
  if (gps.lock) { gps.lock.release().catch(() => {}); gps.lock = null; }
}
document.addEventListener("visibilitychange", async () => {
  if (gps.id !== null && document.visibilityState === "visible" && navigator.wakeLock && !gps.lock) { try { gps.lock = await navigator.wakeLock.request("screen"); } catch (e) {} }
});

/* --- Signature de livraison --- */
function openSignature(m) {
  openModal(`<form data-form="deliver" data-id="${m.id}" class="space-y-3">
    <div class="flex items-center justify-between"><h2 class="text-lg font-semibold">${t("m.signTitle")}</h2><button type="button" data-act="backToMission" data-id="${m.id}" class="text-dim text-xl leading-none">×</button></div>
    <canvas id="sigpad"></canvas>
    <button type="button" data-act="sigClear" class="text-xs text-dim">${t("m.signClear")}</button>
    <div><label class="lbl">${t("m.signName")}</label><input name="signedBy" required maxlength="80" class="inp"></div>
    <button class="btn btn-primary w-full">${t("m.signConfirm")}</button>
  </form>`);
  const cv = $("#sigpad"), r = cv.getBoundingClientRect(), ratio = window.devicePixelRatio || 1;
  cv.width = r.width * ratio; cv.height = r.height * ratio;
  const ctx = cv.getContext("2d"); ctx.scale(ratio, ratio); ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.strokeStyle = "#0a1330";
  let drawing = false; cv.dataset.empty = "1";
  const pt = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  cv.addEventListener("pointerdown", e => { drawing = true; cv.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(...pt(e)); });
  cv.addEventListener("pointermove", e => { if (!drawing) return; ctx.lineTo(...pt(e)); ctx.stroke(); cv.dataset.empty = "0"; });
  cv.addEventListener("pointerup", () => drawing = false);
}
FORMS.deliver = async f => {
  if (!guard()) return;
  const m = S.missions.find(x => x.id === f.dataset.id), cv = $("#sigpad");
  if (!m) return;
  if (cv.dataset.empty === "1" || !f.signedBy.value.trim()) return toast(t("m.signRequired"));
  // signature réduite pour rester légère dans Firestore
  const small = document.createElement("canvas"); small.width = 480; small.height = Math.round(480 * cv.height / cv.width);
  small.getContext("2d").drawImage(cv, 0, 0, small.width, small.height);
  try {
    await setStatus(m, "delivered", { signature: small.toDataURL("image/png"), signedBy: f.signedBy.value.trim(), deliveredAt: TS.now() });
    if (gps.missionId === m.id) stopGps();
    if (m.price > 0 && !m.invoiceId) await createInvoice({ ...m });
    openMission(m.id);
  } catch (e) { fail(e); }
};

/* --- Facturation --- */
async function createInvoice(m) {
  if (!(m.price > 0)) return toast(t("m.noPrice"));
  const cref = db.doc("companies/" + S.cid);
  const iref = cref.collection("invoices").doc();
  const mref = cref.collection("missions").doc(m.id);
  const number = await db.runTransaction(async tx => {
    const c = (await tx.get(cref)).data();
    const mm = (await tx.get(mref)).data();
    if (mm.invoiceId) return mm.invoiceNumber;
    const seq = (c.invoiceSeq || 0) + 1;
    const number = new Date().getFullYear() + "-" + String(seq).padStart(4, "0");
    const rate = Number(c.taxRate ?? 21), ht = round2(mm.price), tva = round2(ht * rate / 100);
    tx.update(cref, { invoiceSeq: seq });
    tx.set(iref, {
      number, seq, missionId: m.id, missionRef: mm.ref,
      client: mm.client || "", clientEmail: mm.clientEmail || "", clientNif: mm.clientNif || "",
      desc: `Transport ${mm.depart} → ${mm.arrivee}` + (mm.goods ? ` · ${mm.goods}` : "") + (mm.weight ? ` · ${mm.weight} t` : ""),
      date: todayStr(), month: monthStr(), ht, rate, tva, ttc: round2(ht + tva), status: "unpaid",
      issuer: { name: c.name || "", nif: c.nif || "", address: c.address || "", city: c.city || "", phone: c.phone || "", email: c.email || "" },
      createdAt: FV.serverTimestamp()
    });
    tx.update(mref, { invoiceId: iref.id, invoiceNumber: number });
    return number;
  });
  toast(t("m.invoiceDone", { n: number }));
}

function qrSvg(text) {
  if (typeof qrcode === "undefined") return `<p class="text-xs p-4 break-all">${esc(text)}</p>`;
  if (qrcode.stringToBytesFuncs && qrcode.stringToBytesFuncs["UTF-8"]) qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"];
  const qr = qrcode(0, "M"); qr.addData(text); qr.make();
  return qr.createSvgTag({ cellSize: 8, margin: 3, scalable: true });
}

/* ---------- Scan / envoi des fichiers ---------- */
function loadImage(file) {
  return new Promise((res, rej) => { const url = URL.createObjectURL(file), img = new Image(); img.onload = () => { URL.revokeObjectURL(url); res(img); }; img.onerror = rej; img.src = url; });
}
async function compressImage(file) {
  const img = await loadImage(file);                   // le navigateur applique l'orientation EXIF
  const max = 2200, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const cv = document.createElement("canvas");
  cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
  const ctx = cv.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(img, 0, 0, cv.width, cv.height);
  const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.82));
  return blob && blob.size < file.size ? blob : file;
}
function pickFiles(missionId, camera) {
  if (!guard()) return;
  S.scanMissionId = missionId;
  const input = $(camera ? "#scan-camera" : "#scan-file");
  input.value = ""; input.click();
}
async function uploadFiles(files) {
  const m = missionById(S.scanMissionId); if (!m || !files.length) return;
  if (!navigator.onLine) toast(t("d.offlineWait"));
  for (const file of files) {
    try {
      let blob = file, type = file.type || "", name = (file.name || "scan").replace(/[^\w.\-]+/g, "_").slice(-80);
      if (type.startsWith("image/")) {
        blob = await compressImage(file).catch(() => file);
        if (blob !== file) { type = "image/jpeg"; name = name.replace(/\.[^.]*$/, "") + ".jpg"; }
      } else if (type !== "application/pdf") { toast(t("d.badType")); continue; }
      if (blob.size > MAX_UPLOAD_MB * 1048576) { toast(t("d.tooBig")); continue; }
      const path = `companies/${S.cid}/missions/${m.id}/${Date.now()}-${name}`;
      const task = storage.ref(path).put(blob, { contentType: type, customMetadata: { missionId: m.id } });
      await new Promise((res, rej) => task.on("state_changed",
        s => toast(`${t("d.uploading")} ${name} · ${Math.round(100 * s.bytesTransferred / (s.totalBytes || 1))} %`), rej, res));
      const url = await task.snapshot.ref.getDownloadURL();
      await db.collection(`companies/${S.cid}/docs`).add({
        missionId: m.id, missionRef: m.ref || "", name, type, size: blob.size, path, url,
        uploadedBy: S.user.uid, uploaderName: S.profile.name || "", createdAt: FV.serverTimestamp()
      });
      toast(t("d.uploaded"));
    } catch (e) { fail(e); }
  }
}
["#scan-camera", "#scan-file"].forEach(sel => $(sel).addEventListener("change", e => uploadFiles(Array.from(e.target.files || []))));

function readDecaForm(f) {

  return o;

async function callDecaApi(missionId, data) {
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), DECA_TIMEOUT_MS);
  try {
    const token = await S.user.getIdToken();
    const res = await fetch(DECA_API, { method: "POST", signal: ctrl.signal,
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify({ missionId, data }) });
    let j = {}; try { j = await res.json(); } catch (e) {}
    if (!res.ok) throw new Error(j.message || "HTTP " + res.status);
    return j;
  } finally { clearTimeout(timer); }
}

    <div><label class="lbl">${t("send.email")}</label><input id="send-email" type="email" value="${esc(email)}" class="inp"></div>
    <button data-act="sendMail" class="btn">${t("send.mail")}</button>
    <div class="flex flex-wrap gap-2 pt-2 border-t border-line">
      ${navigator.share ? `<button data-act="sendShare" class="btn">${t("send.share")}</button>` : ""}
      <button data-act="copyText" data-text="${esc(url)}" class="btn">${t("send.copy")}</button>
    </div>
  </div>`);
}
const sendMsg = () => S.sendPayload.text + "\n" + S.sendPayload.url;
function savePhone(v) { try { localStorage.setItem("bd-last-phone", v); } catch (e) {} }

Object.assign(ACT, {
  scanCamera: d => pickFiles(d.id, true),
  scanFile: d => pickFiles(d.id, false),
  async deleteDoc(d) {
    const doc = S.docs.find(x => x.id === d.id); if (!doc || !confirm(t("c.confirmDelete"))) return;
    try {
      await storage.ref(doc.path).delete().catch(e => { if (e.code !== "storage/object-not-found") throw e; });
      await db.doc(`companies/${S.cid}/docs/${doc.id}`).delete();
    } catch (e) { fail(e); }
  },
  sendDoc(d) { const doc = S.docs.find(x => x.id === d.id); if (doc) openSend(doc.name, `${doc.name} — ${doc.missionRef}`, doc.url); },
  decaOpen(d) { const m = missionById(d.id); if (!m) return; m.deca ? decaView(m) : (guard() && decaForm(m)); },
  decaForm(d) { const m = missionById(d.id); if (m && guard()) decaForm(m); },
  decaView(d) { const m = missionById(d.id); if (m && m.deca) decaView(m); },
  decaRetry() { const dr = S.decaDraft; const m = dr && missionById(dr.missionId); if (m) { decaForm({ ...m, deca: { ...(m.deca || {}), data: dr.data } }); } },
  decaLocal() { const dr = S.decaDraft; const m = dr && missionById(dr.missionId); if (m) printDecaLocal(m, dr.data); },
  qrFull(d) { const m = missionById(d.id) || (S.openDecaId && missionById(S.openDecaId)); if (m && m.deca) qrFull(m); },
  qrClose,
  sendDeca(d) {
    const m = missionById(d.id); if (!m || !m.deca) return;
    const x = m.deca.data || {};
    const text = `DeCA ${m.deca.number}\n${x.origen} → ${x.destino}\nMatrícula: ${x.matricula}${x.remolque ? " / " + x.remolque : ""}\nFecha: ${x.fecha}`;
    openSend("DeCA " + m.deca.number, text, m.deca.url, m.clientEmail || "");
  },
  sendWa() {
    const p = normPhone($("#send-phone").value); if (p) savePhone($("#send-phone").value.trim());
    window.open(`https://wa.me/${p}?text=${encodeURIComponent(sendMsg())}`, "_blank", "noopener");
  },
  sendSms() {
    const raw = $("#send-phone").value.trim(); if (!raw) return toast(t("send.needPhone"));
    savePhone(raw);
    location.href = `sms:${encodeURIComponent(raw.replace(/\s+/g, ""))}${isIOS ? "&" : "?"}body=${encodeURIComponent(sendMsg())}`;
  },
  sendMail() {
    const em = $("#send-email").value.trim(); if (!em) return toast(t("send.needEmail"));
    location.href = `mailto:${encodeURIComponent(em)}?subject=${encodeURIComponent(S.sendPayload.title)}&body=${encodeURIComponent(sendMsg())}`;
  },
  async sendShare() { try { await navigator.share({ title: S.sendPayload.title, text: S.sendPayload.text, url: S.sendPayload.url }); } catch (e) {} }
});
document.addEventListener("input", e => {
  if (e.target.dataset.actInput === "docSearch") {
    S.docSearch = e.target.value; const pos = e.target.selectionStart; render();
    const inp = document.querySelector('[data-act-input="docSearch"]'); inp.focus(); inp.setSelectionRange(pos, pos);
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#qr-full").classList.contains("hidden")) qrClose(); });

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  if (el.type === "checkbox") { ACT[el.dataset.act] && ACT[el.dataset.act](el.dataset, el, e); return; }
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(el.dataset, el, e);
});
document.addEventListener("submit", e => {
  const f = e.target, fn = FORMS[f.dataset.form]; if (!fn) return;
  e.preventDefault();
  const btn = f.querySelector("button:not([type=button])"); if (btn) btn.disabled = true;
  Promise.resolve(fn(f)).finally(() => { if (btn && document.body.contains(btn)) btn.disabled = false; });
});
document.addEventListener("input", e => {
  if (e.target.dataset.actInput === "fretSearch") {
    S.fretSearch = e.target.value; const pos = e.target.selectionStart; render();
    const inp = document.querySelector('[data-act-input="fretSearch"]'); inp.focus(); inp.setSelectionRange(pos, pos);
  }
});
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });

/* =====================================================================
   APPLICATION INSTALLABLE (PWA) : bouton Installer, hors ligne, mises à jour
   ===================================================================== */
Object.assign(I18N.fr, {
  "pwa.install":"Installer","pwa.installed":"Application installée","pwa.bannerTitle":"Installer Bouadigital","pwa.bannerText":"Accès en un geste depuis l'écran d'accueil, plein écran, et utilisable même sans réseau.",
  "pwa.iosTitle":"Installer sur iPhone / iPad","pwa.ios1":"Ouvrez cette page dans Safari.","pwa.ios2":"Touchez le bouton Partager (carré avec une flèche) en bas de l'écran.","pwa.ios3":"Choisissez « Sur l'écran d'accueil », puis « Ajouter ».",
  "pwa.manual":"Dans le menu du navigateur (⋮), choisissez « Installer l'application » ou « Ajouter à l'écran d'accueil ».",
  "pwa.offline":"Hors ligne — vos modifications sont gardées et seront envoyées au retour du réseau.","pwa.online":"Connexion rétablie",
  "pwa.update":"Une nouvelle version de Bouadigital est disponible.","pwa.updateBtn":"Mettre à jour",
  "m.search":"Rechercher (référence, ville, client, immatriculation)…"
});
Object.assign(I18N.es, {
  "pwa.install":"Instalar","pwa.installed":"Aplicación instalada","pwa.bannerTitle":"Instalar Bouadigital","pwa.bannerText":"Acceso directo desde la pantalla de inicio, a pantalla completa y usable incluso sin conexión.",
  "pwa.iosTitle":"Instalar en iPhone / iPad","pwa.ios1":"Abre esta página en Safari.","pwa.ios2":"Toca el botón Compartir (cuadrado con una flecha) en la parte inferior.","pwa.ios3":"Elige «Añadir a pantalla de inicio» y después «Añadir».",
  "pwa.manual":"En el menú del navegador (⋮), elige «Instalar aplicación» o «Añadir a pantalla de inicio».",
  "pwa.offline":"Sin conexión — tus cambios se guardan y se enviarán cuando vuelva la red.","pwa.online":"Conexión restablecida",
  "pwa.update":"Hay una nueva versión de Bouadigital disponible.","pwa.updateBtn":"Actualizar",
  "m.search":"Buscar (referencia, ciudad, cliente, matrícula)…"
});
applyStaticI18n();

const PWA = {
  prompt: null,
  standalone: window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true,
  ios: /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1),
  mobile: /android|iphone|ipad|ipod|mobile/i.test(navigator.userAgent),
  dismissedKey: "bd-install-dismissed"
};
function showInstallButtons(on) {
  document.querySelectorAll(".install-btn").forEach(b => { b.classList.toggle("hidden", !on); b.classList.toggle("inline-flex", on); });
}
function maybeShowBanner() {
  if (PWA.standalone || !PWA.mobile) return;
  let dismissed = 0; try { dismissed = +localStorage.getItem(PWA.dismissedKey) || 0; } catch (e) {}
  if (Date.now() - dismissed < 7 * 864e5) return;            // redemande au plus une fois par semaine
  setTimeout(() => $("#install-banner").classList.remove("hidden"), 2500);
}
if (!PWA.standalone) {
  if (PWA.ios) { showInstallButtons(true); maybeShowBanner(); }
  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault(); PWA.prompt = e;
    showInstallButtons(true); maybeShowBanner();
  });
}
window.addEventListener("appinstalled", () => {
  PWA.prompt = null; PWA.standalone = true;
  showInstallButtons(false); $("#install-banner").classList.add("hidden");
  toast(t("pwa.installed"));
});

/* Hors ligne / en ligne */
function updateOnline(first) {
  const off = !navigator.onLine;
  $("#offline-bar").classList.toggle("hidden", !off);
  if (!off && !first) toast(t("pwa.online"));
}
window.addEventListener("online", () => updateOnline(false));
window.addEventListener("offline", () => updateOnline(false));
updateOnline(true);

/* Service worker + annonce des nouvelles versions */
let swWaiting = null;
function offerUpdate(worker) { swWaiting = worker; $("#update-bar").classList.remove("hidden"); }
if ("serviceWorker" in navigator) {
  window.addEventListener("load", async () => {
    try {
      const reg = await navigator.serviceWorker.register("/sw.js");
      if (reg.waiting && navigator.serviceWorker.controller) offerUpdate(reg.waiting);
      reg.addEventListener("updatefound", () => {
        const nw = reg.installing;
        nw && nw.addEventListener("statechange", () => {
          if (nw.state === "installed" && navigator.serviceWorker.controller) offerUpdate(nw);
        });
      });
      setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000); // vérifie chaque heure
    } catch (e) { console.warn("SW", e); }
  });
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (!reloading) { reloading = true; location.reload(); } });
}

Object.assign(ACT, {
  async install() {
    if (PWA.prompt) {
      PWA.prompt.prompt();
      const { outcome } = await PWA.prompt.userChoice;
      PWA.prompt = null;
      if (outcome === "accepted") { showInstallButtons(false); $("#install-banner").classList.add("hidden"); }
      return;
    }
    if (PWA.ios) { $("#ios-sheet").classList.remove("hidden"); return; }
    toast(t("pwa.manual"));
  },
  installDismiss() { $("#install-banner").classList.add("hidden"); try { localStorage.setItem(PWA.dismissedKey, String(Date.now())); } catch (e) {} },
  iosClose() { $("#ios-sheet").classList.add("hidden"); },
  applyUpdate() { $("#update-bar").classList.add("hidden"); if (swWaiting) swWaiting.postMessage("skipWaiting"); else location.reload(); }
});
document.addEventListener("input", e => {
  if (e.target.dataset.actInput === "mSearch") {
    S.mSearch = e.target.value; const pos = e.target.selectionStart; render();
    const inp = document.querySelector('[data-act-input="mSearch"]'); inp.focus(); inp.setSelectionRange(pos, pos);
  }
});

boot();
</script>
